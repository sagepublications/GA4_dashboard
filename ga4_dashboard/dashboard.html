<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GA4 Dashboard - SAGE Publishing</title>
<style>
:root {
  --sage:       #2e7d32;
  --sage-light: #e8f5e9;
  --ext:        #1565c0;
  --dir:        #ef6c00;
  --oth:        #6a1b9a;
  --srch:       #00838f;
  --nosrch:     #558b2f;
  --neither:    #546e7a;
  --text:       #1a1a1a;
  --muted:      #666;
  --border:     #e0e0e0;
  --bg:         #f4f6f8;
  --radius:     8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); }

header {
  background: var(--sage); color: white;
  padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
header h1 { font-size: 1.4rem; font-weight: 600; }
.subtitle { font-size: 0.82rem; opacity: .75; margin-top: 3px; }

.controls {
  background: white; border-bottom: 1px solid var(--border);
  padding: 14px 40px;
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,.06);
}
.toggle-group { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.toggle-btn {
  padding: 7px 18px; font-size: 0.85rem; font-weight: 500;
  background: white; border: none; cursor: pointer; color: var(--muted);
  border-right: 1px solid var(--border); transition: background .15s, color .15s;
}
.toggle-btn:last-child { border-right: none; }
.toggle-btn.active { background: var(--sage); color: white; }
.toggle-btn:hover:not(.active) { background: var(--sage-light); color: var(--sage); }

.date-group { display: flex; align-items: center; gap: 8px; }
.date-group label { color: var(--muted); font-size: 0.8rem; }
.date-group input[type=date] {
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; font-size: 0.85rem; font-family: inherit; color: var(--text);
}
.refresh-btn {
  padding: 7px 18px; background: var(--sage); color: white;
  border: none; border-radius: 6px; font-size: 0.85rem; font-weight: 500;
  cursor: pointer; transition: opacity .15s;
}
.refresh-btn:hover { opacity: .85; }
.refresh-btn:disabled { opacity: .5; cursor: wait; }

.export-btn {
  padding: 7px 18px; background: white; color: var(--sage);
  border: 1px solid var(--sage); border-radius: 6px; font-size: 0.85rem; font-weight: 500;
  cursor: pointer; transition: background .15s, color .15s;
}
.export-btn:hover { background: var(--sage-light); }
.export-btn:disabled { opacity: .5; cursor: wait; }

.auth-toggle-wrap { display: flex; align-items: center; gap: 8px; }
.auth-toggle-wrap label { font-size: 0.8rem; color: var(--muted); }
.auth-toggle { position: relative; display: inline-block; width: 40px; height: 22px; }
.auth-toggle input { opacity: 0; width: 0; height: 0; }
.auth-slider {
  position: absolute; cursor: pointer; inset: 0;
  background: var(--border); border-radius: 22px; transition: .2s;
}
.auth-slider:before {
  content: ''; position: absolute;
  width: 16px; height: 16px; left: 3px; bottom: 3px;
  background: white; border-radius: 50%; transition: .2s;
}
.auth-toggle input:checked + .auth-slider { background: var(--sage); }
.auth-toggle input:checked + .auth-slider:before { transform: translateX(18px); }
.auth-badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 0.72rem; font-weight: 600; letter-spacing: .03em;
  background: #e8f5e9; color: var(--sage); border: 1px solid #a5d6a7;
  vertical-align: middle; margin-left: 6px;
}
.status-msg { font-size: 0.8rem; color: var(--muted); margin-left: auto; }
.status-msg.loading { color: var(--sage); }
.status-msg.error   { color: #c62828; }

.container { max-width: 1140px; margin: 28px auto; padding: 0 24px 60px; }
.section { margin-bottom: 40px; }
.section-title {
  font-size: 1.05rem; font-weight: 600; color: var(--sage);
  margin-bottom: 8px; padding-bottom: 8px; border-bottom: 2px solid var(--sage-light);
}
.section-base {
  font-size: .8rem; color: var(--muted);
  margin-bottom: 12px;
  padding: 4px 10px;
  background: var(--bg); border-radius: 4px;
  display: inline-block;
}
.methodology-toggle {
  font-size: .75rem; color: var(--muted); cursor: pointer; user-select: none;
  margin-bottom: 14px; display: inline-flex; align-items: center; gap: 4px;
}
.methodology-toggle:hover { color: var(--sage); }
.methodology-body {
  display: none; font-size: .78rem; color: var(--muted);
  background: var(--bg); border-left: 3px solid var(--sage-light);
  padding: 8px 12px; border-radius: 4px; margin-bottom: 14px;
}
.methodology-body.open { display: block; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
.card { background: white; border-radius: var(--radius); padding: 18px 20px; border: 1px solid var(--border); border-top-width: 4px; }
.card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
.card .value { font-size: 2rem; font-weight: 700; line-height: 1; }
.card .sub   { font-size: 0.8rem; color: var(--muted); margin-top: 5px; }
.card.total   { border-top-color: var(--sage);    } .card.total   .value { color: var(--sage);    }
.card.ext     { border-top-color: var(--ext);     } .card.ext     .value { color: var(--ext);     }
.card.dir     { border-top-color: var(--dir);     } .card.dir     .value { color: var(--dir);     }
.card.oth     { border-top-color: var(--oth);     } .card.oth     .value { color: var(--oth);     }
.card.srch    { border-top-color: var(--srch);    } .card.srch    .value { color: var(--srch);   }
.card.nosrch  { border-top-color: var(--nosrch);  } .card.nosrch  .value { color: var(--nosrch); }
.card.neither { border-top-color: var(--neither); } .card.neither .value { color: var(--neither); }

.bar-wrap { background: white; border-radius: var(--radius); border: 1px solid var(--border); padding: 20px 24px; margin-bottom: 24px; }
.bar-header { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; }
.bar { height: 38px; border-radius: 4px; display: flex; overflow: hidden; margin-bottom: 12px; }
.seg {
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 600; color: white;
  min-width: 0; overflow: hidden; white-space: nowrap; transition: width .5s ease;
}
.seg.ext     { background: var(--ext);     }
.seg.dir     { background: var(--dir);     }
.seg.oth     { background: var(--oth);     }
.seg.srch    { background: var(--srch);    }
.seg.nosrch  { background: var(--nosrch);  }
.seg.neither { background: var(--neither); }

.legend { display: flex; gap: 18px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
th { background: var(--sage-light); color: var(--sage); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .04em; padding: 11px 16px; text-align: left; }
td { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

.skeleton {
  background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 4px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skel-card  { height: 90px; }
.skel-bar   { height: 140px; }
.skel-table { height: 200px; }

/* -- Tooltips -- */
.tip-wrap { position: relative; display: inline-block; vertical-align: middle; margin-left: 4px; }
.tip-icon {
  font-style: normal; font-size: 0.72rem; color: var(--muted);
  cursor: help; opacity: 0.6; user-select: none;
  border: 1px solid currentColor; border-radius: 50%;
  width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center;
  line-height: 1;
}
.tip-wrap:hover .tip-icon { opacity: 1; color: var(--sage); border-color: var(--sage); }
.tip-box {
  display: none;
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: #1e1e1e;
  color: #f0f0f0;
  font-size: 0.78rem;
  line-height: 1.55;
  padding: 10px 14px;
  border-radius: 7px;
  width: 270px;
  z-index: 9999;
  pointer-events: none;
  font-weight: 400;
  box-shadow: 0 6px 20px rgba(0,0,0,.35);
  white-space: normal;
}
.tip-box::after {
  content: '';
  position: absolute;
  top: 100%; left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: #1e1e1e;
}
.tip-wrap:hover .tip-box { display: block; }
/* keep tooltip on-screen for right-edge cards */
.tip-right .tip-box  { left: auto; right: 0;   transform: none; }
.tip-right .tip-box::after { left: auto; right: 14px; transform: none; }
.tip-left  .tip-box  { left: 0;    transform: none; }
.tip-left  .tip-box::after { left: 14px; transform: none; }

/* -- Search sub-breakdown -- */
.search-sub {
  background: white;
  border: 1px solid var(--border);
  border-left: 4px solid var(--srch);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 16px 20px;
  margin: -10px 0 24px 24px;
}
.search-sub-header {
  font-size: .85rem; font-weight: 600; color: var(--srch); margin-bottom: 14px;
}
.search-sub-bar { margin-bottom: 10px; }
.search-sub-bar:last-child { margin-bottom: 0; }
.search-sub-label { display: flex; justify-content: space-between; font-size: .82rem; margin-bottom: 4px; }
.search-sub-label .s-name { font-weight: 500; }
.search-sub-label .s-stat { color: var(--muted); }
.s-track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.s-fill  { height: 100%; border-radius: 4px; transition: width .5s ease; }
.s-fill.reached  { background: var(--srch);   }
.s-fill.not-reached { background: var(--neither); }

footer { text-align: center; padding: 24px; font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div>
    <h1>GA4 Session Analytics - SAGE Publishing</h1>
    <div class="subtitle" id="header-subtitle">Loading...</div>
  </div>
</header>

<div class="controls">
  <div class="toggle-group">
    <button class="toggle-btn active" data-view="combined">Combined</button>
    <button class="toggle-btn" data-view="srm">SRM</button>
    <button class="toggle-btn" data-view="sk">SK</button>
    <button class="toggle-btn" data-view="us">Universal Search</button>
  </div>

  <div class="date-group">
    <label>From</label>
    <input type="date" id="date-start">
    <label>To</label>
    <input type="date" id="date-end">
    <button class="refresh-btn" id="refresh-btn" onclick="loadData()">Refresh</button>
    <button class="export-btn" id="export-btn" onclick="exportHTML()">Export HTML</button>
  </div>

  <div class="auth-toggle-wrap">
    <label for="auth-toggle-input">Authenticated only</label>
    <label class="auth-toggle">
      <input type="checkbox" id="auth-toggle-input" onchange="loadData()">
      <span class="auth-slider"></span>
    </label>
  </div>

  <span class="status-msg" id="status-msg"></span>
</div>

<div class="container" id="main-content"></div>
<footer id="footer"></footer>

<script>
const LABELS = { combined: 'Combined (SRM + SK)', srm: 'SRM', sk: 'SK', us: 'Universal Search' };
const PROPS  = { srm: '257995281', sk: '258026800', us: '264964195' };

let currentView = 'combined';
let currentData = null;

(function init() {
  const today     = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const d90       = new Date(today); d90.setDate(today.getDate() - 90);
  document.getElementById('date-end').value   = fmt(yesterday);
  document.getElementById('date-start').value = fmt(d90);

  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.dataset.view;
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('.auth-toggle-wrap').style.display =
        currentView === 'us' ? 'none' : '';
      if (currentData) renderAll(currentData);
    });
  });

  loadData();
})();

function fmt(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function authOnly() {
  return document.getElementById('auth-toggle-input').checked;
}

async function loadData() {
  const start = document.getElementById('date-start').value;
  const end   = document.getElementById('date-end').value;
  if (!start || !end) return;

  setStatus('loading', 'Fetching data...');
  document.getElementById('refresh-btn').disabled = true;
  showSkeleton();

  try {
    const auth = authOnly() ? '&auth=1' : '';
    const resp = await fetch(`/api/data?start=${start}&end=${end}${auth}`);
    if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
    currentData = await resp.json();
    renderAll(currentData);
    setStatus('', 'Updated ' + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus('error', '⚠ ' + e.message);
  } finally {
    document.getElementById('refresh-btn').disabled = false;
  }
}

function exportHTML() {
  const start = document.getElementById('date-start').value;
  const end   = document.getElementById('date-end').value;
  if (!start || !end) return;
  const auth   = authOnly() ? '&auth=1' : '';
  const suffix = authOnly() ? '_authenticated' : '';
  const btn    = document.getElementById('export-btn');
  btn.disabled = true;
  btn.textContent = 'Exporting...';
  const a = document.createElement('a');
  a.href     = `/export?start=${start}&end=${end}${auth}`;
  a.download = `sage_ga4_${start}_to_${end}${suffix}.html`;
  a.click();
  setTimeout(() => { btn.disabled = false; btn.textContent = 'Export HTML'; }, 2000);
}

function setStatus(cls, msg) {
  const el = document.getElementById('status-msg');
  el.className   = 'status-msg ' + cls;
  el.textContent = msg;
}

function showSkeleton() {
  document.getElementById('main-content').innerHTML = `
    <div class="section">
      <div class="section-title">1 &middot; Session Origin</div>
      <div class="cards">${'<div class="card skeleton skel-card"></div>'.repeat(4)}</div>
      <div class="skeleton skel-bar" style="margin-bottom:24px"></div>
      <div class="skeleton skel-table"></div>
    </div>
    <div class="section" style="margin-top:32px">
      <div class="section-title">2 &middot; Session Behaviour</div>
      <div class="cards">${'<div class="card skeleton skel-card"></div>'.repeat(3)}</div>
      <div class="skeleton skel-bar"></div>
    </div>`;
}

function pct(part, total) { return total ? Math.round(part / total * 1000) / 10 : 0; }
function num(n) { return (n || 0).toLocaleString(); }

function methodology(id, text) {
  return `<span class="methodology-toggle" onclick="(function(el){var b=document.getElementById('${id}');b.classList.toggle('open');el.querySelector('.m-arrow').textContent=b.classList.contains('open')?'▲':'▼';})(this)">
    <span class="m-arrow">▼</span> How this data is collected
  </span>
  <div class="methodology-body" id="${id}">${text}</div>`;
}

function tip(text, edge) {
  const cls = edge ? ` tip-${edge}` : '';
  return `<span class="tip-wrap${cls}"><span class="tip-icon">i</span><div class="tip-box">${text}</div></span>`;
}

function renderAll(data) {
  const d        = data[currentView];
  const meta     = data.meta;
  const isAuth   = meta.auth_only && currentView !== 'us';
  const propLine = currentView === 'combined'
    ? `SRM (${PROPS.srm}) + SK (${PROPS.sk})`
    : `Property ${PROPS[currentView]}`;
  const authBadge = isAuth ? ' <span class="auth-badge">Authenticated only</span>' : '';

  document.getElementById('header-subtitle').innerHTML =
    `${propLine}  &middot;  ${meta.start} &rarr; ${meta.end}${authBadge}`;
  document.getElementById('footer').textContent =
    `Google Analytics 4  ·  ${propLine}  ·  ${meta.start} → ${meta.end}${isAuth ? '  ·  Authenticated users only' : ''}`;
  document.getElementById('main-content').innerHTML =
    channelSection(d.channels, isAuth, d.search.total) + searchSection(d.search, isAuth);
}

function channelSection(ch, isAuth, baseTotal) {
  const t      = baseTotal || ch.total || 0;
  const othAll = (ch.other || 0) + (ch.unassigned || 0);
  const extP   = pct(ch.external, t);
  const dirP   = pct(ch.direct,   t);
  const othP   = pct(othAll,      t);
  const unaP   = pct(ch.unassigned, t);
  const label  = LABELS[currentView];

  const rows = (ch.breakdown || []).map(r => `
    <tr>
      <td>${r.channel}</td>
      <td class="num">${num(r.sessions)}</td>
      <td class="num">${pct(r.sessions, t)}%</td>
    </tr>`).join('');

  return `
  <div class="section">
    <div class="section-title">1 &middot; Session Origin - External Discovery vs Direct <span style="font-weight:400;color:var(--muted);font-size:.9rem">(${label})</span>${isAuth ? ' <span class="auth-badge">Authenticated only</span>' : ''}
      ${tip('How sessions arrived at the site, grouped by channel. Switching between Combined / SRM / SK / Universal Search changes the property scope; the date range switcher at the top of the page changes the time window.')}
    </div>
    ${methodology('method-s1', 'Pulls from GA4 session channel grouping - how each session started and what brought the user to the site. Covers all traffic sources including organic search, direct, referral, and AI assistants.')}
    <div class="cards">
      <div class="card total">
        <div class="label">Total Sessions ${tip('All sessions in the selected property and date range' + (isAuth ? ', filtered to authenticated users only.' : '.') + ' Matches the base used in Section 2.')}</div>
        <div class="value">${num(t)}</div>
      </div>
      <div class="card ext">
        <div class="label">External Discovery ${tip(`${extP}% of sessions (${num(ch.external)}) came from outside Sage - users arriving via Google, academic databases, referral links, or AI assistants like ChatGPT. They did not type the URL directly.`)}</div>
        <div class="value">${extP}%</div>
        <div class="sub">${num(ch.external)} sessions</div>
      </div>
      <div class="card dir">
        <div class="label">Direct ${tip('Sessions GA4 could not attribute to a known external source. Includes typed URLs and bookmarks, but also traffic from messaging apps, PDF links, and email campaigns with missing or broken UTM tags - parameters added to URLs that tell GA4 where traffic came from. Treat this as unknown origin rather than purely direct navigation.', '')}</div>
        <div class="value">${dirP}%</div>
        <div class="sub">${num(ch.direct)} sessions</div>
      </div>
      <div class="card oth">
        <div class="label">Other / Unassigned ${tip('Sessions where GA4 has attribution data but could not map it to a defined channel, plus Unassigned sessions with missing referrer data. Usually caused by malformed or missing UTM parameters. A high figure may indicate a tracking issue worth investigating.', 'right')}</div>
        <div class="value">${othP}%</div>
        <div class="sub">${num(othAll)} sessions</div>
      </div>
    </div>
    <div class="bar-wrap">
      <div class="bar-header"><span>Session origin breakdown</span><span>${num(t)} total sessions</span></div>
      <div class="bar">
        <div class="seg ext"    style="width:${extP}%">${extP > 5 ? extP + '%' : ''}</div>
        <div class="seg dir"    style="width:${dirP}%">${dirP > 5 ? dirP + '%' : ''}</div>
        <div class="seg oth"    style="width:${othP}%">${othP > 5 ? othP + '%' : ''}</div>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="dot" style="background:var(--ext)"></div> External Discovery (${extP}%)</div>
        <div class="legend-item"><div class="dot" style="background:var(--dir)"></div> Direct (${dirP}%)</div>
        <div class="legend-item"><div class="dot" style="background:var(--oth)"></div> Other / Unassigned (${othP}%)</div>
      </div>
    </div>
    <table>
      <thead><tr><th>Channel Group</th><th class="num">Sessions</th><th class="num">% of Total</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${ch.unassigned ? `<p class="unassigned-note">&#x2139;&nbsp;&nbsp;Other / Unassigned includes ${num(ch.unassigned)} Unassigned sessions - sessions GA4 could not attribute to any channel (e.g. missing referrer data).</p>` : ''}
  </div>`;
}

function searchSection(s, isAuth) {
  const t = s.total || 0;

  const baseLabel = isAuth
    ? `Base: ${num(t)} authenticated sessions`
    : `Base: ${num(t)} sessions - all users`;

  if (currentView === 'us') {
    const evts   = s.search_events || 0;
    const perSes = t ? (evts / t).toFixed(2) : '0.00';
    return `
  <div class="section" style="margin-top:32px">
    <div class="section-title">2 &middot; Search Volume &amp; Reach${isAuth ? ' <span class="auth-badge">Authenticated only</span>' : ''}
      ${tip('All sessions in this view fired the parasol_universal_search event at least once. Section 1 shows where those searchers came from. This section shows how intensively they searched.')}
    </div>
    <p class="section-base">${baseLabel} &mdash; all fired <code>parasol_universal_search</code></p>
    ${methodology('method-s2', 'Scoped to sessions where parasol_universal_search fired at least once. The authenticated filter does not apply to Universal Search — all sessions are included regardless of login state. Total Search Events counts every individual event so one session can contribute multiple. Searches per Session measures query intensity.')}
    <div class="cards">
      <div class="card srch">
        <div class="label">Search Sessions ${tip('Total sessions where parasol_universal_search fired at least once. This is the base population for the entire Universal Search view.')}</div>
        <div class="value">${num(t)}</div>
        <div class="sub">sessions</div>
      </div>
      <div class="card total">
        <div class="label">Total Search Events ${tip('Count of individual parasol_universal_search events. One session can fire multiple events if the user ran several searches.')}</div>
        <div class="value">${num(evts)}</div>
        <div class="sub">individual searches</div>
      </div>
      <div class="card ext">
        <div class="label">Searches per Session ${tip('Average number of parasol_universal_search events per session. A higher figure indicates users are iterating on queries rather than finding what they need on the first attempt.', 'right')}</div>
        <div class="value">${perSes}</div>
        <div class="sub">on average</div>
      </div>
    </div>
  </div>`;
  }

  // Standard SRM / SK / Combined layout
  const cns   = s.content_no_search || 0;
  const neit  = s.neither           || 0;
  const src   = s.searched_reached_content || 0;
  const snc   = s.searched_no_content      || 0;
  const srchP = pct(s.searched || 0, t);
  const cnsP  = pct(cns,  t);
  const neitP = pct(neit, t);
  const rcP   = pct(src, s.searched || 1);
  const rncP  = pct(snc, s.searched || 1);

  function subBar(fillCls, label, p, n, tipText) {
    return `<div class="search-sub-bar">
      <div class="search-sub-label">
        <span class="s-name">${label}${tipText ? ' ' + tip(tipText) : ''}</span>
        <span class="s-stat">${p}% &middot; ${num(n)} sessions</span>
      </div>
      <div class="s-track"><div class="s-fill ${fillCls}" style="width:${p}%"></div></div>
    </div>`;
  }

  return `
  <div class="section" style="margin-top:32px">
    <div class="section-title">2 &middot; Session Behaviour${isAuth ? ' <span class="auth-badge">Authenticated only</span>' : ''}
      ${tip('Search usage and content engagement for this property and date range.')}
    </div>
    <p class="section-base">${baseLabel}</p>
    ${methodology('method-s2', 'Used Search: sessions where view_search_results fired at least once. Total Search Events: count of individual view_search_results events (one session can contribute multiple). Content Views from Search: page views where the HTTP referrer was a search results page (/search/results), scoped to recognised content page paths.')}
    <div class="cards">
      <div class="card srch">
        <div class="label">Used Search ${tip(`${srchP}% of sessions (${num(s.searched)}) included at least one view_search_results event — the user typed a query and viewed results at some point during their visit.`)}</div>
        <div class="value">${srchP}%</div>
        <div class="sub">${num(s.searched)} sessions</div>
      </div>
      <div class="card total">
        <div class="label">Total Search Events ${tip('Count of individual view_search_results events fired. One session can contribute multiple search events if the user ran several searches during their visit.')}</div>
        <div class="value">${num(s.search_events || 0)}</div>
        <div class="sub">individual searches</div>
      </div>
      <div class="card ext">
        <div class="label">Content Views from Search ${tip('Page views on recognised content pages where the HTTP referrer was a search results page (/search/results). Identifies content views driven directly by a search interaction.', 'right')}</div>
        <div class="value">${num(s.content_views_from_search || 0)}</div>
        <div class="sub">page views</div>
      </div>
    </div>
    <p style="font-size:.8rem;color:var(--muted);margin-top:4px">
      &#x2139;&nbsp;&nbsp;"Used Search" = sessions where <code>view_search_results</code> fired at least once.
    </p>
  </div>`;
}

</script>
</body>
</html>
